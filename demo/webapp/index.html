<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ilo toki</title>
        <meta content="ilo toki" property="og:title" />
        <meta content="a kind of janky tts for toki pona" property="og:description" />
        <meta content="https://balt-dev.github.io/ilo-toki" property="og:url" />
        <meta content="#404040" data-react-helmet="true" name="theme-color" />

        <style>
            body {
                background-color: #000000;
                color: white;
            }
            * {
                font-family: sans-serif;
                font-size: 24px;
            }
            div.main {
                margin: 3em auto;
                padding: 1em;
                width: max(800pt, 60%);
                border-radius: 1em;
                background-color: #202020;
                display: flex;
                align-content: center;
                flex-direction: column;
                gap: 0.3em;
            }
            textarea, input, div.input, button {
                background-color: #101010;
                color: #ffffff;
                text-shadow: #ffffffa0 0px 0px 5px;
                border: none;
                border-radius: 3pt;
                box-shadow: #00000020 5px 5px 5px;
                transition: background-color 0.05s ease-out;
            }
            textarea:hover, div.input:hover, button:hover  {
                background-color: #181818;
            }
            div.input {
                padding: 0.4em;
                margin: auto;
                width: max(600pt, 80%);
                display: flex;
                justify-content: space-between;
            }
            input {
                background-color: #ffffff10;
                color: #ffffff;
                text-shadow: #ffffffa0 0px 0px 5px;
                width: max(10%, 5em);
                box-shadow: #00000040 3px 3px 5px inset;
            }
            textarea {
                display: block;
                width: calc(100% - 1.2em);
                margin: unset 2em;
                padding: 0.6em;
                resize: vertical;
                height: 10em;
            }
            button {
                width: max(30%, 200pt);
                padding: 0.4em;
                margin: 0px auto 1.2em;
                cursor: pointer;
            }
            button:active {
                background-color: #040404;
            }
            span.english {
                opacity: 80%;
                font-size: 90%;
            }
            div.error {
                background-color: #600404;
                color: #ffa0a0;
                text-shadow: #ffa0a0a0 0px 0px 7px;
                margin: auto;
                width: max(70%, 600px);
                padding: 0.3em;
                border-radius: 0.5em;
                box-shadow: #00000020 5px 5px 5px;
            }
            div.error h3 {
                text-align: center;
                font-weight: 500;
                font-size: 120%;
                margin: 0px;
                padding-bottom: 0.3em;
            }
            p.error_text {
                background-color: #202020a0;
                resize: none;
                color: #ffe0e0;
                text-shadow: #ffe0e080 0px 0px 3px;
                box-shadow: #00000040 5px 5px 10px inset;
                padding: 0.3em;
                border-radius: 0.3em;
                font-family: monospace;
                white-space: pre-line;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <textarea
                id="input"
                placeholder="o sitelen... (Write here...)"
            >
nasin pi &lt;1.25 196&gt;ilo tawa &lt;0.8 220&gt;sewi la, pipi suwi li ken ala tawa sewi.
.&lt;0.9 246.94&gt; this supports very very rough tokiponization . . .
nja wuwojiti yukete . soweli Ajina ...
t k p k t k p t t k p t k t p p ....

&lt;1 261.625&gt;a &lt;1 293.665&gt;i &lt;1 329.625&gt;u &lt;1 349.23&gt;e &lt;1 391.995&gt;oooo....
la &lt;1 349.23&gt;wi &lt;1 329.625&gt;ju &lt;1 293.665&gt;me &lt;1 261.625&gt;noooo....
&lt;1 391.995&gt;too.. &lt;1 261.625&gt;kii.. &lt;1 196&gt;paa.. &lt;1 261.625&gt;sooooo.
            </textarea>
            <div class="input">
                <input type="number" min="110" max="22050" value="220" id="pitch" />
                <label for="sample_rate">sijelo kalama <span class="english">(Pitch)</span></label>
            </div>
            <div class="input">
                <input type="number" min="2000" max="96000" value="44100" step="1" id="sample_rate" />
                <label for="sample_rate">mute pi kipisi kalama <span class="english">(Sample Rate)</span></label>
            </div>
            <div class="input">
                <input type="number" min="0" max="10" value="0.2" id="vowel_time" />
                <label for="vowel_time">tenpo pi nimi uta <span class="english">(Vowel Time)</span></label>
            </div>
            <div class="input">
                <input type="number" min="0" max="10" value="0.03" id="consonant_time" />
                <label for="consonant_time">tenpo pi nimi kiwen <span class="english">(Consonant Time)</span></label>
            </div>
            <div class="input">
                <input type="number" min="0" max="10" value="0.1" id="space_time" />
                <label for="consonant_time">tenpo pi nimi weka <span class="english">(Space Time)</span></label>
            </div>
            <div class="input">
                <input type="number" min="0" max="10" value="0.03" id="transition_time" />
                <label for="transition_time">tenpo pi ante nimi <span class="english">(Transition Time)</span></label>
            </div>
            <button id="button">o pali! <span class="english">(Generate!)</span></button>
            <div id="error" class="error" hidden>
                <h3>pakala!</h3>
                <p id="error_text" class="error_text">
                </p>
            </div>
            <audio controls id="audio" hidden>
                <source src="data:audio/wav," type="audio/wav" id="audio_source">
            </audio>
        </div>

        <script type="module">
            "use strict";
            import init, { generate } from "./pkg/glue.js";
            var initialized = false;
            const run = async () => {
                await init();
                initialized = true;
            };
            run();

            const textNode = document.getElementById("input");
            const sampleRateNode = document.getElementById("sample_rate");
            const pitchNode = document.getElementById("pitch");
            const vowelTimeNode = document.getElementById("vowel_time");
            const transitionTimeNode = document.getElementById("transition_time");
            const consonantTimeNode = document.getElementById("consonant_time");
            const spaceTimeNode = document.getElementById("space_time");
            const audioNode = document.getElementById("audio");
            const audioSourceNode = document.getElementById("audio_source");
            const buttonNode = document.getElementById("button");
            const errorNode = document.getElementById("error");
            const errorTextNode = document.getElementById("error_text");
            const generateAudio = () => {
              if (!initialized) return;
              let data = generate(textNode.value, sampleRateNode.value, vowelTimeNode.value, consonantTimeNode.value, spaceTimeNode.value, pitchNode.value, transitionTimeNode.value);
              if (typeof data === "string") {
                console.error(data);
                audioNode.hidden = true;
                errorNode.hidden = false;
                errorTextNode.textContent = "" + data;
                return;
              }
              errorNode.hidden = true;
              audioNode.hidden = false;
              const blob = new Blob([data], { type: 'audio/wav' });
              const url = URL.createObjectURL(blob);
              audioSourceNode.setAttribute("src", url);
              audioNode.load();
            };
            button.addEventListener('click', generateAudio);
        </script>
    </body>
</html>
